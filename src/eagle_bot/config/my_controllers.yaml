# This file configures the controllers for the robot, primarily the differential drive controller.
# For more details on the parameters, see the ros2_controllers documentation for DiffDriveController.
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz. The rate at which the controller manager updates.

    # Broadcaster for the state of the wheel joints.
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # The main controller for the differential drive base.
    diff_controller:
      type: diff_drive_controller/DiffDriveController

diff_controller:
  ros__parameters:
    # Names of the wheel joints. These must match the joints in the robot's URDF file.
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    # --- Wheel Calibration ---
    # These parameters are crucial for accurate odometry and movement.
    # They may need to be tuned based on the physical characteristics of the robot.

    # The distance between the centers of the two wheels (in meters).
    wheel_separation: 0.68

    # The radius of the wheels (in meters).
    wheel_radius: 0.095

    # Multiplier for wheel separation. Can be used to correct for systematic turning errors.
    wheel_separation_multiplier: 1.0

    # Multipliers for wheel radius. These are very useful for correcting drift when driving straight.
    # If the robot drifts to one side, adjust the multiplier for the opposite wheel slightly.
    # Example: If robot drifts right, the left wheel is too fast. Decrease left_wheel_radius_multiplier.
    left_wheel_radius_multiplier: 0.985 # Tuned to correct for a slight right drift.
    right_wheel_radius_multiplier: 1.0

    # --- Odometry and TF ---
    publish_rate: 50.0  # Rate at which odometry information is published.
    odom_frame_id: odom # The frame ID for odometry messages.
    base_frame_id: base_link # The robot's base frame.
    pose_covariance_diagonal : [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    open_loop: false # Use feedback from wheel encoders.
    enable_odom_tf: true # Publish the odom -> base_link transform.

    # --- Command and Velocity Limits ---
    cmd_vel_timeout: 5.0 # Time in seconds before the robot stops if no new velocity command is received.
    publish_limited_velocity: true
    use_stamped_vel: false

    # Preserve turning radius when limiting speed/acceleration/jerk.
    preserve_turning_radius: true

    # Publish the limited velocity command.
    publish_cmd: true

    # Publish wheel data.
    publish_wheel_data: true

    # Velocity and acceleration limits
    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 0.3
    linear.x.min_velocity: -0.3

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 0.3
    angular.z.min_velocity: -0.3
